<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo-App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Todo App</h1>

    <div class="todoContainer">
      <!-- input area -->

      <div class="inputArea">
        <input type="text" placeholder="Enter task" id="inputTask" value="Learn HTML" />
        <button id="addBtn">Add</button>
      </div>

      <!-- todo list items -->
      <ul class="todoList" id="list">
        <!-- <li>
          <p>Learn HTML</p> <span class="iconsParent"> <span class="edit">Edit</span> <span class="delete">Delete</span></span>
        </li>
        <li>
          Learn HTML <span class="iconsParent"> <span class="edit">Edit</span> <span class="delete">Delete</span></span>
        </li> -->
        
      </ul>

      <div class="deleteBtnParent">
        <button id="deleteAllBtn">Delete all</button>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="app.js"></script>
  </body>
</html>
